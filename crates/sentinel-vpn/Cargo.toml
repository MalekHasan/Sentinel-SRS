[package]
name = "sentinel-vpn"
description = "Userspace packet engine for the Android VpnService tunnel (A0 Spike 1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures = "0.3.34"
log = "0.4.34"
netstack-smoltcp = "0.2.4"
rustix = { version = "1.1.5", features = ["fs"] }
simple-dns = "0.12.0"
socket2 = { version = "0.6.5", features = ["all"] }
tokio = { version = "1.53.3", features = ["rt", "rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
# Optional second stack, only to re-run the comparison in ADR-0006.
ipstack = { version = "1.0.1", optional = true }

[features]
ipstack = ["dep:ipstack"]

[dev-dependencies]
etherparse = "0.20"
libc = "0.2.190"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }

[lints]
workspace = true
