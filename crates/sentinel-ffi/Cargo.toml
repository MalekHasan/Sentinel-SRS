[package]
name = "sentinel-ffi"
description = "Kotlin (and later Swift) bindings to the Sentinel core, through UniFFI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib: the .so loaded by the Android app. lib: used by the bindgen binary and tests.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
# Only for generating bindings on the developer's machine or in CI.
cli = ["uniffi/cli"]

[dependencies]
log = "0.4.34"
sentinel-store = { version = "0.0.0", path = "../sentinel-store" }
sentinel-vpn = { path = "../sentinel-vpn" }
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "sync", "time", "macros"] }
uniffi = "0.32.2"

[lints]
workspace = true

[dev-dependencies]
etherparse = "0.20"
socket2 = { version = "0.6.5", features = ["all"] }
tempfile = "3.27.0"
