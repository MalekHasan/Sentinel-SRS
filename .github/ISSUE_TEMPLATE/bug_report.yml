name: Bug report
description: Something does not work as described. For security problems, use SECURITY.md instead.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security problem?** Please do not file it here. Use the Security tab → Report a vulnerability."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS version
      placeholder: e.g. Samsung Galaxy A54, Android 14
  - type: input
    id: version
    attributes:
      label: Sentinel version or commit
