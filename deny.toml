# cargo-deny configuration. CI fails on any dependency whose licence is not
# compatible with GPL-3.0-or-later, on known vulnerabilities, and on unknown sources.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # basic-toml is unmaintained; no vulnerability is known. askama, which UniFFI's
  # bindings generator uses, has no release without it yet (askama_derive 0.16.1,
  # uniffi 0.32.2). It comes in only through sentinel-ffi's `cli` feature: the
  # generator run on the build machine, not the library in the app. Remove this once
  # UniFFI moves to an askama without basic-toml.
  { id = "RUSTSEC-2026-0374", reason = "build-time only, in the UniFFI bindings generator; no release without it yet" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# All of these can be combined into a GPL-3.0-or-later program.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Our own unpublished crates are GPL-3.0-or-later.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
